<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bakery AR</title>

<link rel="stylesheet" href="style.css">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<img src="Screenshot (345).png" alt="Logo">

</div>

</header>

<!-- ================= HERO ================= -->

<section class="hero">

<div class="collectionIntro">

<h2>OUR COLLECTION</h2>

</div>

</section>

<div class="categoryTabs">

<button class="tab active" data-category="pastry">
Pastries
</button>

<button class="tab" data-category="jar">
Dessert Jars
</button>

<button class="tab" data-category="cupcake">
Cupcakes
</button>

<button class="tab" data-category="donut">
Donuts
</button>

</div>

<!-- Pastries -->


<div class="products activeProducts" id="pastry">

<div class="product"

data-model="cheesebl.glb"

data-name="Classic Cheesecake"

data-poster="cheesel.png">

<img src="cheesel.png">

<p>Classic Cheesecake</p>

</div>

<div class="product"

data-model="chocosambl.glb"

data-name="Dark Chocolate Mousse Pastry"

data-poster="moouse.png">

<img src="moouse.png">

<p>Dark Chocolate Mousse</p>

</div>

<div class="product"

data-model="vanillasam.glb"

data-name="Strawberry Vanilla Delight"

data-poster="vanilla.png">

<img src="vanilla.png">

<p>Strawberry Vanilla Delight</p>

</div>

</div>

</div>

<!-- Dessert Jars -->



<div class="products" id="jar">

<div class="product"
data-model="lotus2com.glb"
data-name="Lotus Biscoff Cheesecake Jar"
data-poster="lotusj.png">

<img src="lotusj.png">

<p>Lotus Biscoff Jar</p>

</div>

<div class="product"
data-model="redjarglb.glb"
data-name="Red Velvet Cream Jar"
data-poster="redj.png">

<img src="redj.png">

<p>Red Velvet Jar</p>

</div>

<div class="product"
data-model="van.glb"
data-name="Strawberry Vanilla Bliss Jar"
data-poster="vanj.png">

<img src="vanj.png">

<p>Strawberry Vanilla Jar</p>

</div>

<div class="product"
data-model="chocom.glb"
data-name="Chocolate Indulgence Jar"
data-poster="chocoj.png">

<img src="chocoj.png">

<p>Chocolate Indulgence</p>

</div>

</div>

</div>

<!-- Cupcakes -->


<div class="products" id="cupcake">

<div class="product"
data-model="vanilcup.glb"
data-name="Classic Vanilla Cupcake"
data-poster="vancup.png">

<img src="vancup.png">

<p>Vanilla Cupcake</p>

</div>

<div class="product"
data-model="redcup.glb"
data-name="Red Velvet Cupcake"
data-poster="chococup.png">

<img src="chococup.png">

<p>Red Velvet Cupcake</p>

</div>

<div class="product"
data-model="strawcup.glb"
data-name="Strawberry Cream Cupcake"
data-poster="strcup.png">

<img src="strcup.png">

<p>Strawberry Cupcake</p>

</div>

</div>

</div>

<!-- Donuts -->

<div class="products" id="donut">

<div class="product"
data-model="vandocom.glb"
data-name="Vanilla Dream Donut"
data-poster="vando.png">

<img src="vando.png">

<p>Vanilla Dream</p>

</div>

<div class="product"
data-model="chocodocom.glb"
data-name="Belgian Chocolate Donut"
data-poster="chocodo.png">

<img src="chocodo.png">

<p>Belgian Chocolate</p>

</div>

<div class="product"
data-model="pinkdocom.glb"
data-name="Strawberry Glaze Donut"
data-poster="pinkdo.png">

<img src="pinkdo.png">

<p>Strawberry Glaze</p>

</div>

</div>

</div>

</section>

<!-- ================= POPUP ================= -->
<model-viewer
id="hiddenViewer"
style="width:1px;height:1px;opacity:0;position:absolute;"
camera-controls
ar
ar-modes="scene-viewer webxr quick-look"
environment-image="neutral"
shadow-intensity="1">
</model-viewer>
<div id="arPopup" class="popup">

    <div class="popupBox">

        <h2 id="popupTitle"></h2>

        <button id="viewAR">

            View in AR

        </button>

        <button id="closePopup">

            Close

        </button>

    </div>

</div>
  <script src="script.js"></script>

</body>

</html>
