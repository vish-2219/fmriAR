<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bakery AR</title>

<link rel="stylesheet" href="style.css">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<img src="Screenshot (345).png" alt="Logo">

<section class="hero">

<div class="collectionIntro">

<h2>OUR COLLECTION</h2>

</div>

</section>

<div class="categoryTabs">

<button class="tab active" data-category="pastry">
Pastries
</button>

<button class="tab" data-category="jar">
Dessert Jars
</button>

<button class="tab" data-category="cupcake">
Cupcakes
</button>

<button class="tab" data-category="donut">
Donuts
</button>

</div>

<!-- ================= POPUP ================= -->
<model-viewer
id="hiddenViewer"
style="width:1px;height:1px;opacity:0;position:absolute;"
camera-controls
ar
ar-modes="scene-viewer webxr quick-look"
environment-image="neutral"
shadow-intensity="1"
src="">
</model-viewer>
<div id="arPopup" class="popup">

    <div class="popupBox">

        <h2 id="popupTitle"></h2>

        <button id="viewAR">

            View in AR

        </button>

        <button id="closePopup">

            Close

        </button>

    </div>

</div>
