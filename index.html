<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bakery AR</title>

<link rel="stylesheet" href="style.css">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<img src="Screenshot (345).png" alt="Logo">

</div>

</header>

<!-- ================= HERO ================= -->

<section class="hero">

<h1>Packed with love &</h1>

<p>all your favourites!</p>

<div class="collectionIntro">

<h2>OUR COLLECTION</h2>
</div>

</section>

<div class="categoryTabs">

<button class="tab active" data-category="pastry">
Pastries
</button>

<button class="tab" data-category="jar">
Dessert Jars
</button>

<button class="tab" data-category="cupcake">
Cupcakes
</button>

<button class="tab" data-category="donut">
Donuts
</button>

</div>

<!-- Pastries -->




<div class="products activeProducts" id="pastry">

<div class="product"

data-model="cheesepaspcom.glb"

data-name="Classic Cheesecake"

data-poster="cheeselv.PNG">

<img src="cheeselv.PNG">

<p>Classic Cheesecake</p>

</div>

<div class="product"

data-model="chocopaspcom.glb"

data-name="Dark Chocolate Mousse Pastry"

data-poster="moousev.PNG">

<img src="moousev.PNG">

<p>Dark Chocolate Mousse</p>

</div>

<div class="product"

data-model="vanpaspcom.glb"

data-name="Strawberry Vanilla Delight"

data-poster="vanillav.PNG">

<img src="vanillav.PNG">

<p>Strawberry Vanilla Delight</p>

</div>

</div>

</div>

<!-- Dessert Jars -->


<div class="products" id="jar">

<div class="product"
data-model="lotusjar.glb"
data-name="Lotus Biscoff Cheesecake Jar"
data-poster="lotusjv.PNG">

<img src="lotusjv.PNG">

<p>Lotus Biscoff Jar</p>

</div>

<div class="product"
data-model="redjarglb.glb"
data-name="Red Velvet Cream Jar"
data-poster="redjv.PNG">

<img src="redjv.PNG">

<p>Red Velvet Jar</p>

</div>


<div class="product"
data-model="chocom.glb"
data-name="Chocolate Indulgence Jar"
data-poster="chocojv.PNG">

<img src="chocojv.PNG">

<p>Chocolate Indulgence</p>

</div>

</div>

</div>

<!-- Cupcakes -->



<div class="products" id="cupcake">

<div class="product"
data-model="vanilacup.glb"
data-name="Classic Vanilla Cupcake"
data-poster="vancupv.PNG">

<img src="vancupv.PNG">

<p>Vanilla Cupcake</p>

</div>

<div class="product"
data-model="redcup.glb"
data-name="Red Velvet Cupcake"
data-poster="chococupv.PNG">

<img src="chococupv.PNG">

<p>Red Velvet Cupcake</p>

</div>

<div class="product"
data-model="strawcup.glb"
data-name="Strawberry Cream Cupcake"
data-poster="strcupv.PNG">

<img src="strcupv.PNG">

<p>Strawberry Cupcake</p>

</div>

</div>

</div>

<!-- Donuts -->



<div class="products" id="donut">

<div class="product"
data-model="vandopcom.glb"
data-name="Vanilla Dream Donut"
data-poster="vandov.PNG">

<img src="vandov.PNG">

<p>Vanilla Dream</p>

</div>

<div class="product"
data-model="chocodopcom.glb"
data-name="Belgian Chocolate Donut"
data-poster="chocodov.PNG">

<img src="chocodov.PNG">

<p>Belgian Chocolate</p>

</div>

<div class="product"
data-model="pinkdopcom.glb"
data-name="Strawberry Glaze Donut"
data-poster="pinkdov.PNG">

<img src="pinkdov.PNG">

<p>Strawberry Glaze</p>

</div>

</div>

</div>

</section>

<!-- ================= POPUP ================= -->
<model-viewer
id="hiddenViewer"
style="width:1px;height:1px;opacity:0;position:absolute;"
camera-controls
ar
ar-modes="scene-viewer webxr quick-look"
environment-image="neutral"
shadow-intensity="1">
</model-viewer>

<script src="script.js"></script>

</body>

</html>
